services:
  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: development
      DATABASE_URL: sqlite:////data/open_loop_tracker.db
      CLIENT_REMINDER_1_MINUTES: ${CLIENT_REMINDER_1_MINUTES:-120}
      CLIENT_REMINDER_2_MINUTES: ${CLIENT_REMINDER_2_MINUTES:-360}
      CLIENT_ESCALATION_MINUTES: ${CLIENT_ESCALATION_MINUTES:-1440}
      MODERATOR_REMINDER_1_MINUTES: ${MODERATOR_REMINDER_1_MINUTES:-30}
      MODERATOR_REMINDER_2_MINUTES: ${MODERATOR_REMINDER_2_MINUTES:-120}
      MODERATOR_ESCALATION_MINUTES: ${MODERATOR_ESCALATION_MINUTES:-240}
      DELIVERY_MAX_ATTEMPTS: ${DELIVERY_MAX_ATTEMPTS:-3}
      DELIVERY_RETRY_DELAY_MINUTES: ${DELIVERY_RETRY_DELAY_MINUTES:-5}
    ports:
      - "8000:8000"
    volumes:
      - open_loop_data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
      interval: 5s
      timeout: 3s
      retries: 12

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.35.7
    environment:
      N8N_BLOCK_ENV_ACCESS_IN_NODE: !!str false
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-http://backend:8000}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-UTC}
      TZ: ${GENERIC_TIMEZONE:-UTC}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      SLA_DEMO_FORCE_FAILURE: ${SLA_DEMO_FORCE_FAILURE:-false}
      RECOVERY_DEMO_FORCE_FAILURE: ${RECOVERY_DEMO_FORCE_FAILURE:-false}
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  open_loop_data:
  n8n_data:
